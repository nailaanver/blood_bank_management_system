{% extends 'master.html' %}
{% block title %}Assign Donation Date{% endblock %}

{% block content %}
<div class="assign-container">
  <div class="assign-card">
    <h2 class="assign-title">🩸 Assign Donation Date</h2>
    <p class="assign-subtitle">
      Assign a donation date and time for 
      <strong>{{ appointment.donor.username }}</strong>.
    </p>

    <form method="POST" class="assign-form">
      {% csrf_token %}
      
      <div class="form-group">
  <label for="donation_date" class="form-label">Donation Date</label>
  <input 
    type="date" 
    id="donation_date" 
    name="donation_date" 
    required 
    min="{{ today }}" 
    class="form-control" 
    value="{{ appointment.appointment_date|date:'Y-m-d' }}"
  >
</div>

<div class="form-group">
  <label for="donation_time" class="form-label">Donation Time</label>
  <input 
    type="time" 
    id="donation_time" 
    name="donation_time" 
    required 
    class="form-control" 
    value="{{ appointment.appointment_time|time:'H:i' }}"
  >
</div>



      <button type="submit" class="btn-assign">✅ Assign Date</button>
      <a href="{% url 'manage_requests' %}" class="btn-cancel">↩ Back</a>
    </form>
  </div>
</div>

<style>
/* 🌟 Page Container */
.assign-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 85vh;
  background: linear-gradient(135deg, #f8f9fa, #ffe8e8);
}

/* 🧾 Card */
.assign-card {
  background: #fff;
  border-radius: 16px;
  padding: 40px 50px;
  width: 420px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
  text-align: center;
  animation: fadeIn 0.6s ease;
}

/* 🔖 Title */
.assign-title {
  font-size: 1.8rem;
  color: #e63946;
  margin-bottom: 10px;
  font-weight: 700;
}

/* 🩸 Subtitle */
.assign-subtitle {
  color: #555;
  font-size: 1rem;
  margin-bottom: 25px;
}

/* 🧍 Form */
.assign-form .form-group {
  margin-bottom: 20px;
  text-align: left;
}

.form-label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: #444;
}

.form-control {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 1rem;
  transition: 0.3s ease;
}

.form-control:focus {
  outline: none;
  border-color: #e63946;
  box-shadow: 0 0 5px rgba(230, 57, 70, 0.4);
}

/* 🩸 Buttons */
.btn-assign {
  background-color: #28a745;
  color: #fff;
  padding: 10px 20px;
  font-size: 1rem;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 100%;
  margin-top: 10px;
}

.btn-assign:hover {
  background-color: #218838;
}

.btn-cancel {
  display: inline-block;
  margin-top: 15px;
  font-size: 0.95rem;
  color: #555;
  text-decoration: none;
}

.btn-cancel:hover {
  color: #e63946;
  text-decoration: underline;
}

/* ✨ Animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 📱 Responsive Design */
@media (max-width: 600px) {
  .assign-card {
    width: 90%;
    padding: 30px 20px;
  }
  .assign-title {
    font-size: 1.5rem;
  }
}
</style>
{% endblock %}
