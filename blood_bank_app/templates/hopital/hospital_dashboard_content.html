{% extends 'master.html' %}
{% block title %}Hospital Dashboard{% endblock %}

{% block content %}
<div class="chart-container text-center mt-4">
  <h3 class="text-danger mb-3">Blood Stock Overview</h3>
  {% if chart_html %}
      {{ chart_html|safe }}
  {% else %}
      <p class="text-muted">No blood stock data available.</p>
  {% endif %}
</div>

<style>
.chart-container {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  margin: 30px auto;
  max-width: 800px;
}
</style>
{% endblock %}

{% block extra_scripts %}
<!-- Load echarts (required for pyecharts charts) -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
{% endblock %}
